name: Build Release Archives

on:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist/${{ matrix.goarch }}
          go build -o dist/${{ matrix.goarch }}/nsq-http-facade

      - name: Package archive
        run: |
          package_dir=package/${{ matrix.goarch }}
          mkdir -p "$package_dir"
          cp dist/${{ matrix.goarch }}/nsq-http-facade "$package_dir"/
          cp config.toml.example README.md "$package_dir"/
          if [ -f LICENSE ]; then
            cp LICENSE "$package_dir"/
          fi
          tar -czf nsq-http-facade-linux-${{ matrix.goarch }}.tar.gz -C "$package_dir" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nsq-http-facade-linux-${{ matrix.goarch }}
          path: nsq-http-facade-linux-${{ matrix.goarch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: main-${{ github.run_number }}
          name: Main build ${{ github.run_number }}
          files: dist/**/nsq-http-facade-linux-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
